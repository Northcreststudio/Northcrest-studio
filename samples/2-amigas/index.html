<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>2 Amigas Salsa</title>
    <meta name="description" content="2 Amigas: small-batch, fire-roasted salsa from Calgary, made by two best friends." />
    <meta name="theme-color" content="#110D0B" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta property="og:title" content="2 Amigas Salsa" />
    <meta property="og:description" content="Fire-roasted, hand-jarred salsa from Calgary." />

    <!-- Fonts: Gloock (display serif), Hanken Grotesk (body), Big Shoulders Text (labels + figures).
         Change here and in src/styles/tokens.css -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Text:wght@500;600;700&family=Gloock&family=Hanken+Grotesk:ital,wght@0,400;0,500;0,600;1,400&display=swap"
    />

    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <!-- ── Loading screen ── -->
    <div class="loader" id="loader" role="status" aria-live="polite">
      <div class="loader__mark" data-logo-mark></div>
      <div class="loader__meta">
        <span class="loader__line" data-loader-line>Roasting tomatoes</span>
        <span class="loader__pct" data-loader-pct>0%</span>
      </div>
      <div class="loader__bar" aria-hidden="true"><span data-loader-bar></span></div>
    </div>

    <a class="skip-link" href="#main">Skip to content</a>
    <div class="grain" aria-hidden="true"></div>

    <!-- ── Nav ── -->
    <header class="nav" id="nav">
      <div class="nav__inner">
        <a class="nav__logo" href="#top" aria-label="2 Amigas, back to top" data-logo></a>
        <button class="nav__burger" type="button" aria-expanded="false" aria-controls="nav-menu" aria-label="Open menu">
          <span></span><span></span>
        </button>
        <nav class="nav__menu" id="nav-menu" aria-label="Main">
          <ul class="nav__links" data-nav></ul>
        </nav>
      </div>
    </header>

    <main id="main">
      <!--
        ── 3D stage: hero + ingredient burst ──
        One WebGL canvas sits in a sticky layer behind both sections.
        Scroll progress through .stage drives the camera and ingredients.
      -->
      <div class="stage" id="top">
        <div class="stage__sticky">
          <div class="stage__canvas" id="jar-canvas" role="img" aria-label="A 3D jar of 2 Amigas salsa on a stone counter. Drag to turn it."></div>
          <div class="stage__shade" aria-hidden="true"></div>
          <ol class="explode-captions" data-explode-captions aria-label="What goes in the jar"></ol>
          <div class="explode-progress" aria-hidden="true"><span data-explode-bar></span></div>
        </div>

        <section class="hero" aria-labelledby="hero-title">
          <div class="hero__inner container">
            <div class="hero__copy">
              <p class="eyebrow" data-hero-eyebrow></p>
              <h1 class="hero__title" id="hero-title">
                <span data-hero-top></span>
                <em class="hero__accent" data-hero-accent></em>
                <span data-hero-bottom></span>
              </h1>
              <p class="hero__body" data-hero-body></p>
            </div>
            <!-- Invisible box the 3D jar lines up with in the hero -->
            <div class="hero__jar-slot" data-jar-slot aria-hidden="true"></div>
            <div class="hero__controls">
              <div class="switcher" data-switcher aria-label="Choose a salsa"></div>
              <p class="hero__hint" data-hero-hint>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h18M3 12l4-4M3 12l4 4M21 12l-4-4M21 12l-4 4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" /></svg>
                <span></span>
              </p>
            </div>
          </div>
          <a class="scroll-cue" href="#explode" data-scroll-cue>
            <span class="scroll-cue__line" aria-hidden="true"></span>
            <span class="scroll-cue__text"></span>
          </a>
        </section>

        <section class="explode" id="explode" aria-label="What goes in the jar">
          <h2 class="visually-hidden" data-explode-heading></h2>
        </section>
      </div>

      <!-- ── Facts ribbon ── -->
      <div class="ticker" aria-label="About the salsa"><ul data-marquee></ul></div>

      <!-- ── Flavours ── -->
      <section class="section flavours" id="flavours" aria-labelledby="flavours-title">
        <div class="container">
          <header class="section-head">
            <p class="eyebrow" data-fl-eyebrow></p>
            <h2 id="flavours-title" data-fl-heading></h2>
            <p class="section-head__body" data-fl-body></p>
          </header>

          <div class="flavour-cards" role="tablist" aria-label="Salsas" data-flavour-tabs></div>

          <div class="flavour-detail" role="tabpanel" id="flavour-panel" tabindex="0" data-flavour-panel>
            <div class="flavour-detail__copy">
              <p class="flavour-detail__heat-word" data-fd-heatword></p>
              <h3 class="flavour-detail__name" data-fd-name></h3>
              <p class="flavour-detail__tagline" data-fd-tagline></p>
              <p class="flavour-detail__desc" data-fd-desc></p>
              <dl class="specs">
                <div><dt data-fd-ing-label></dt><dd><ul class="ing-list" data-fd-ingredients></ul></dd></div>
                <div><dt data-fd-pair-label></dt><dd data-fd-pairing></dd></div>
              </dl>
            </div>

            <!-- Heat dial -->
            <div class="heat" data-heat>
              <div class="heat__stage">
                <canvas class="heat__flames" data-heat-flames aria-hidden="true"></canvas>
                <canvas class="heat__dial" data-heat-dial role="meter" aria-valuemin="1" aria-valuemax="5" aria-label="Heat level"></canvas>
              </div>
              <div class="heat__readout">
                <div><span class="heat__label">Heat</span><span class="heat__num"><span data-heat-num>1</span><small>/5</small></span></div>
                <div><span class="heat__label">Scoville</span><span class="heat__shu" data-heat-shu></span></div>
                <div><span class="heat__label">Rating</span><span class="heat__word" data-heat-word></span></div>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- ── Our Story ── -->
      <section class="section story" id="story" aria-labelledby="story-title">
        <div class="container story__grid">
          <div class="story__copy">
            <p class="eyebrow" data-st-eyebrow></p>
            <h2 id="story-title" data-st-heading></h2>
            <div class="story__text" data-st-paragraphs></div>
            <p class="story__sig" data-st-sig></p>
          </div>
          <figure class="story__shot">
            <div class="story__img" data-group-shot></div>
            <figcaption>All three salsas, 250 mL each.</figcaption>
          </figure>
        </div>
        <div class="container">
          <ol class="milestones" data-st-milestones></ol>
        </div>
      </section>

      <!-- ── Chip-dip ── -->
      <section class="section dip" id="dip" aria-labelledby="dip-title">
        <div class="container dip__grid">
          <div class="dip__copy">
            <p class="eyebrow" data-dip-eyebrow></p>
            <h2 id="dip-title" data-dip-heading></h2>
            <p class="dip__intro" data-dip-body></p>
            <div class="switcher switcher--compact" data-switcher aria-label="Choose the salsa in the bowl"></div>
            <blockquote class="dip__note" aria-live="polite" data-dip-message></blockquote>
            <div class="dip__meta">
              <button class="btn" type="button" data-dip-button></button>
              <p class="dip__count"><span data-dip-count-label></span> <strong data-dip-count>0</strong></p>
            </div>
          </div>
          <div class="dip__play" data-dip-play role="img" aria-label="A ceramic bowl of salsa and a tortilla chip. Drag the chip into the bowl, or use the Dip the chip button.">
            <p class="dip__hint" aria-hidden="true" data-dip-hint>Drag the chip</p>
            <p class="dip__crunch" aria-hidden="true" data-dip-crunch>Crunch.</p>
          </div>
        </div>
      </section>

      <!-- ── Recipes ── -->
      <section class="section recipes" id="recipes" aria-labelledby="recipes-title">
        <div class="container">
          <header class="section-head section-head--left">
            <p class="eyebrow" data-rc-eyebrow></p>
            <h2 id="recipes-title" data-rc-heading></h2>
          </header>
          <ul class="recipe-grid" data-recipes></ul>
        </div>
      </section>

      <!-- ── Where to buy ── -->
      <section class="section find" id="find-us" aria-labelledby="find-title">
        <div class="container find__grid">
          <div class="find__copy">
            <p class="eyebrow" data-fu-eyebrow></p>
            <h2 id="find-title" data-fu-heading></h2>
            <p data-fu-body></p>
            <ul class="locations" data-locations></ul>
          </div>
          <figure class="map" data-map>
            <figcaption class="map__note">Calgary · stylised, not to scale</figcaption>
          </figure>
        </div>
      </section>

      <!-- ── Contact ── -->
      <section class="section contact" id="contact" aria-labelledby="contact-title">
        <div class="container contact__grid">
          <div class="contact__signup">
            <p class="eyebrow" data-ct-eyebrow></p>
            <h2 id="contact-title" data-ct-heading></h2>
            <p data-ct-body></p>
            <form class="signup" data-signup novalidate>
              <label class="visually-hidden" for="signup-email">Email address</label>
              <input id="signup-email" name="email" type="email" autocomplete="email" required data-signup-input />
              <button class="btn btn--solid" type="submit" data-signup-button></button>
              <p class="signup__msg" role="status" aria-live="polite" data-signup-msg></p>
            </form>
          </div>
          <aside class="contact__card">
            <h3 data-ct-wholesale-heading></h3>
            <p data-ct-wholesale-body></p>
            <dl class="contact__lines">
              <div><dt>Email</dt><dd data-ct-wholesale-email></dd></div>
              <div><dt>Phone</dt><dd data-ct-phone></dd></div>
            </dl>
            <ul class="socials" data-socials></ul>
          </aside>
        </div>
      </section>
    </main>

    <!-- ── Footer ── -->
    <footer class="footer">
      <div class="container footer__inner">
        <a class="footer__logo" href="#top" aria-label="2 Amigas, back to top" data-logo></a>
        <ul class="footer__links" data-footer-links></ul>
        <p class="footer__small"><span data-footer-copy></span> · <a data-footer-credit></a></p>
      </div>
    </footer>
  </body>
</html>
